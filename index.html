<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex</title>
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./css/dialog.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <script src="./templates.js"></script>
    <script src="./script.js" defer></script>
    <link rel="shortcut icon" href="./assets/img/95c-pokeball-1594373.png" type="image/x-icon">
</head>

<body onload="getPokemon()">

    <header>

        <div class="header-content">
            <img src="./assets/img/95c-pokeball-1594373.png" alt="Pokeball-Logo">
            <p>PoKéDex</p>
            <input type="text" placeholder="SEARCH POKEMON">
        </div>

    </header>

    <main>

        <div class="pokemon-grid" id="pokemon-card">

        </div>

        <button class="load-more">LOAD MORE</button>

    </main>

    <footer>

        <div class="footer-content">
            <p>© 2026 MyPoKéDex</p>
            <p>API by Pokeapi.co</p>
        </div>

    </footer>

    <dialog class="pokemon-dialog">

        <div class="dialog-content">

            <div class="dialog-header">
                <p>#0001</p>
                <p>BISASAM</p>
            </div>

            <div class="dialog-image">
                <img src="./assets/img/001.png" alt="Bisasam">
            </div>

            <div class="dialog-types">
                <span>GRASS</span>
                <span>POISON</span>
            </div>

            <div class="pokemon-info">
                <p>HEIGHT: 0.7M</p>
                <p>WEIGHT: 6.9KG</p>
                <p>ABILITIES: xxxxx</p>
                <p>ich glaub ich bin der avatar</p>
            </div>

        </div>
        <div class="dialog-buttons">
            <button class="previous-button"><</button>
            <button class="close-button">X</button>
            <button class="next-button">></button>
        </div>



    </dialog>


</body>

</html>

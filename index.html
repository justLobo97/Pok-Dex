<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPokéDex</title>
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/card_type_color.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./css/dialog.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/loading_screen.css">
    <script src="./js/templates.js"></script>
    <script src="./js/dialog.js" defer></script>
    <script src="./js/script.js" defer></script>
    <link rel="shortcut icon" href="./assets/img/95c-pokeball-1594373.png" type="image/x-icon">
</head>

<body onload="getPokemon()">

    <header>

        <div class="header-content">
            <img src="./assets/img/95c-pokeball-1594373.png" alt="Pokeball-Logo">
            <p>PoKéDex</p>
            <input id="search-pokemon" type="text" placeholder="SEARCH POKEMON" oninput="searchPokemon()">
        </div>

    </header>

    <main>

        <div class="pokemon-grid" id="pokemon-card">

        </div>

        <div class="buttons">
            <button class="load-more" onclick="nextPokemon()">LOAD MORE</button>
            <button class="back-to-top" id="back-to-top" onclick="backToTop()">RESET</button>

            <div class="loading-screen" id="loading-screen">
                <div class="pokeball-loader">
                    <div class="pokeball-button"></div>
                </div>
            </div>
        </div>



    </main>

    <footer>

        <div class="footer-content">
            <p>© 2026 MyPoKéDex</p>
            <p>API by Pokeapi.co</p>
        </div>

    </footer>

    <dialog class="pokemon-dialog" id="pokemon-dialog">
    </dialog>


</body>

</html>
